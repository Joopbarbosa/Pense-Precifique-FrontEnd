<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Detalhe do Produto — Pense & Precifique</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font, 'Inter'), -apple-system, BlinkMacSystemFont, sans-serif;
    background: #F8F8F8; color: #2D2A26; -webkit-font-smoothing: antialiased; min-height: 100vh;
  }
  #root { min-height: 100vh; }
  :root {
    --orange: #F97316; --orange-soft: #FFF1E8; --teal: #2A9D8F; --teal-deep: #1F7A6F;
    --ink: #2D2A26; --muted: #8A8780; --line: #ECEAE5; --danger: #C0492B;
    --r-card: 16px; --r-input: 10px; --r-btn: 10px;
  }
  ::placeholder { color: #B7B4AD; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: none; } }
  @keyframes scaleIn { from { opacity: 0; transform: scale(0.94) translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes flash { 0% { background: rgba(42,157,143,0.18); } 100% { background: transparent; } }

  .app-shell { display: flex; min-height: 100vh; }
  .sidebar {
    width: 252px; flex-shrink: 0; background: #fff; border-right: 1px solid var(--line);
    display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; z-index: 60;
  }
  .main-area { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .content { padding: 30px 36px 64px; max-width: 940px; width: 100%; margin: 0 auto; }
  .mobile-topbar { display: none; }
  .scrim { display: none; }
  .drawer-close { display: none; }

  /* histórico — tabela desktop / cards mobile */
  .hist-row {
    display: grid; grid-template-columns: 116px 1fr 116px 1.4fr;
    gap: 16px; align-items: center; padding: 15px 20px; border-top: 1px solid var(--line);
  }
  .hist-card { display: none; }
  .hist-head { display: grid; grid-template-columns: 116px 1fr 116px 1.4fr; gap: 16px; padding: 13px 20px; background: #FBFAF8; }

  @media (max-width: 760px) {
    .hist-head, .hist-row { display: none; }
    .hist-card { display: block; }
  }
  @media (max-width: 980px) {
    .sidebar {
      position: fixed; top: 0; left: 0; transform: translateX(-100%);
      transition: transform .26s cubic-bezier(.4,0,.2,1); box-shadow: 0 12px 40px rgba(0,0,0,0.16);
    }
    .sidebar.open { transform: translateX(0); }
    .mobile-topbar {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 12px 16px; background: #fff; border-bottom: 1px solid var(--line);
      position: sticky; top: 0; z-index: 40;
    }
    .scrim.show { display: block; position: fixed; inset: 0; background: rgba(20,18,16,0.32); z-index: 55; }
    .drawer-close { display: flex !important; }
    .content { padding: 20px 16px 64px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<template id="__bundler_thumbnail">
  <div style="width:100%;height:100%;display:grid;place-items:center;background:linear-gradient(150deg,#2A9D8F,#1F7A6F);">
    <svg width="56%" height="56%" viewBox="0 0 100 100" fill="none">
      <path d="M50 16 76 30v40L50 84 24 70V30L50 16Z" stroke="#EAFBF7" stroke-width="5" stroke-linejoin="round"/>
      <path d="M24 30 50 44l26-14M50 44v40" stroke="#EAFBF7" stroke-width="5" stroke-linejoin="round"/>
      <circle cx="74" cy="20" r="3.4" fill="#FFC9A8"/><circle cx="82" cy="26" r="2.6" fill="#FFC9A8"/>
    </svg>
  </div>
</template>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="detalhe-produto-app.jsx"></script>
</body>
</html>
