<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Recibo do Sinal — Pense & Precifique</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<meta name="ext-resource-dependency" content="logo.png" data-resource-id="logo" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font, 'Inter'), -apple-system, BlinkMacSystemFont, sans-serif;
    background: #F8F8F8; color: #2D2A26; -webkit-font-smoothing: antialiased; min-height: 100vh;
  }
  #root { min-height: 100vh; }
  :root {
    --orange: #F97316; --orange-soft: #FFF1E8; --teal: #2A9D8F; --teal-deep: #1F7A6F;
    --ink: #2D2A26; --muted: #8A8780; --line: #ECEAE5;
    --danger: #C0492B; --danger-soft: #FBEDE9; --danger-line: #F0D4CC;
    --r-card: 16px; --r-input: 10px; --r-btn: 10px;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: none; } }

  .app-shell { display: flex; min-height: 100vh; }
  .sidebar {
    width: 252px; flex-shrink: 0; background: #fff; border-right: 1px solid var(--line);
    display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; z-index: 60;
  }
  .main-area { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .doc-scroll { flex: 1; overflow: auto; padding: 28px 36px 56px; }
  .doc-wrap { max-width: 820px; margin: 0 auto; }
  .mobile-topbar { display: none; }
  .scrim { display: none; }
  .drawer-close { display: none; }

  /* folha A4 */
  .a4 {
    background: #fff; width: 100%; min-height: calc((820px - 72px) * 1.414);
    box-shadow: 0 10px 40px -8px rgba(31,38,52,0.18), 0 2px 8px rgba(0,0,0,0.06);
    border: 1px solid #EFEDE8; border-radius: 4px;
    padding: 56px 56px; display: flex; flex-direction: column;
  }
  .a4-table { width: 100%; border-collapse: collapse; }
  .a4-table th { text-align: left; font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.05em; color: #9A968E; padding: 0 10px 9px; border-bottom: 1.5px solid var(--teal); }
  .a4-table td { font-size: 13.5px; color: #3A372F; padding: 13px 10px; border-bottom: 1px solid #F0EEE9; vertical-align: top; }
  .a4-table .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

  @media (max-width: 980px) {
    .sidebar {
      position: fixed; top: 0; left: 0; transform: translateX(-100%);
      transition: transform .26s cubic-bezier(.4,0,.2,1); box-shadow: 0 12px 40px rgba(0,0,0,0.16);
    }
    .sidebar.open { transform: translateX(0); }
    .mobile-topbar {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 12px 16px; background: #fff; border-bottom: 1px solid var(--line);
      position: sticky; top: 0; z-index: 40;
    }
    .scrim.show { display: block; position: fixed; inset: 0; background: rgba(20,18,16,0.32); z-index: 55; }
    .drawer-close { display: flex !important; }
    .doc-scroll { padding: 18px 14px 56px; }
    .a4 { padding: 32px 24px; min-height: 0; }
  }
</style>
</head>
<body>
<div id="root"></div>

<template id="__bundler_thumbnail">
  <div style="width:100%;height:100%;display:grid;place-items:center;background:linear-gradient(150deg,#2A9D8F,#1F7A6F);">
    <svg width="54%" height="54%" viewBox="0 0 100 100" fill="none">
      <rect x="22" y="16" width="56" height="68" rx="7" stroke="#EAFBF7" stroke-width="5"/>
      <path d="M38 50 47 59 64 40" stroke="#EAFBF7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
</template>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="recibo-sinal-app.jsx"></script>
</body>
</html>
