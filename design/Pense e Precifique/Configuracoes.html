<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Configurações — Pense & Precifique</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font, 'Inter'), -apple-system, BlinkMacSystemFont, sans-serif;
    background: #F8F8F8; color: #2D2A26; -webkit-font-smoothing: antialiased; min-height: 100vh;
  }
  #root { min-height: 100vh; }
  :root {
    --orange: #F97316; --orange-soft: #FFF1E8; --teal: #2A9D8F; --teal-deep: #1F7A6F;
    --ink: #2D2A26; --muted: #8A8780; --line: #ECEAE5; --danger: #C0492B;
    --r-card: 16px; --r-input: 10px; --r-btn: 10px;
  }
  ::placeholder { color: #B7B4AD; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes toastIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes pulseRing { 0% { box-shadow: 0 8px 18px -8px var(--ring); } 50% { box-shadow: 0 8px 24px -6px var(--ring); } 100% { box-shadow: 0 8px 18px -8px var(--ring); } }

  .app-shell { display: flex; min-height: 100vh; }
  .sidebar {
    width: 252px; flex-shrink: 0; background: #fff; border-right: 1px solid var(--line);
    display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; z-index: 60;
  }
  .main-area { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .content { padding: 30px 36px 80px; max-width: 940px; width: 100%; margin: 0 auto; }
  .cfg-grid { display: grid; grid-template-columns: 1fr 320px; gap: 24px; align-items: start; }
  @media (max-width: 920px) { .cfg-grid { grid-template-columns: 1fr; } }
  .mobile-topbar { display: none; }
  .scrim { display: none; }
  .drawer-close { display: none; }

  @media (max-width: 980px) {
    .sidebar {
      position: fixed; top: 0; left: 0; transform: translateX(-100%);
      transition: transform .26s cubic-bezier(.4,0,.2,1); box-shadow: 0 12px 40px rgba(0,0,0,0.16);
    }
    .sidebar.open { transform: translateX(0); }
    .mobile-topbar {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 12px 16px; background: #fff; border-bottom: 1px solid var(--line);
      position: sticky; top: 0; z-index: 40;
    }
    .scrim.show { display: block; position: fixed; inset: 0; background: rgba(20,18,16,0.32); z-index: 55; }
    .drawer-close { display: flex !important; }
    .content { padding: 20px 16px 80px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<template id="__bundler_thumbnail">
  <div style="width:100%;height:100%;display:grid;place-items:center;background:linear-gradient(150deg,#2A9D8F,#F97316);">
    <svg width="52%" height="52%" viewBox="0 0 100 100" fill="none">
      <circle cx="50" cy="50" r="16" stroke="#FFF3E9" stroke-width="5"/>
      <path d="M50 24v10M50 66v10M24 50h10M66 50h10M32 32l7 7M61 61l7 7M68 32l-7 7M39 61l-7 7" stroke="#FFF3E9" stroke-width="5" stroke-linecap="round"/>
    </svg>
  </div>
</template>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="image-slot.js"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="configuracoes-app.jsx"></script>
</body>
</html>
