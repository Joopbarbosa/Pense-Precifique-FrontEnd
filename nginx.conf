server {
  # OP #429 — porta >1024 porque o container passa a rodar como usuário não-root
  # (USER nginx no Dockerfile); processo sem privilégio não pode bindar porta <1024.
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
